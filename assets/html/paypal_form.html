<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="base-uri 'self' https://*.paypal.com paypalobjects.com">
    <title>Centered PayPal Button</title>
    <style>
        body {
            background-color: #FAF0E6;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #paypal-button-container-P-5G376592NK9596341M4L2EPA {
            position: absolute;
            width: 100%; 
            transition: all 0.5s ease-in-out;
        }

        .to-top {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            transition: all 0.5s ease-in-out;
        }

        .to-center {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="paypal-button-container-P-5G376592NK9596341M4L2EPA" class="to-center"></div>
    <script src="https://www.paypal.com/sdk/js?client-id=Acb15E9G0uzfwMn6Lv9-4goLil_7_286aJ4XcAfTKlnhIOGymFft9BtZ9Al-C5UBTvciC50qu4WEh96Q&currency=ILS" data-sdk-integration-source="button-factory"></script>
    <script>
        const buttonContainer = document.getElementById("paypal-button-container-P-5G376592NK9596341M4L2EPA");

        let postParams = {
            "DisplayName": "Assaff",
            "Plan": "OneMonth",
        }

        paypal.Buttons({
            style: {
                shape: 'rect',
                color: 'gold',
                layout: 'vertical',
                label: 'subscribe'
            },
            createOrder: function(data, actions) {
                return actions.order.create({
                    purchase_units: [{
                        amount: {
                            currency_code: "ILS",
                            value: "20.00"
                        },
                        description: "Purchase Unit test description",
                        custom_id: "Assaff" // Ace can add here the display name - and I can get it in the response under custom_id
                    }]
                })
            },
            onClick: function () {
                // Move button to the top on click
                buttonContainer.classList.remove("to-center");
                buttonContainer.classList.add("to-top");
            },
            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details,actions) {
                    let payload = {
                        "primary_recipients": [{ "billing_info": details["payer"] }],
                        "detail": {
                            "terms_and_conditions": "No refund after 21 days.",
                            "currency_code": details["purchase_units"][0]["amount"]["currency_code"]
                        },
                        "items": [{
                            "name": "One-Month subscription",
                            "unit_amount": details["purchase_units"][0]["amount"],
                            "quantity": "1"
                        }],
                        "payments": {
                            "amount": details["purchase_units"][0]["amount"]
                        }
                    }

                    postParams["OrderId"] = details.id // send transaction id as it is the one located in the business dashboard
                    postParams["InvoiceData"] = payload
                    alert('Post -' + JSON.stringify(postParams))
                    return fetch('https://onefiftyapimgmt.azure-api.net/OneFiftyApp/v1/user/activate/subscription', {
                        method: 'post',
                        mode: "cors",
                        headers: {
                            'content-type': 'application/json',
                            'Authorization': 'Bearer '
                        },
                        body: JSON.stringify(postParams)
                    })
                })
            },
            onCancel: function () {
                // Return button to the center when the PayPal form is closed
                buttonContainer.classList.remove("to-top");
                buttonContainer.classList.add("to-center");
            },
        }).render('#paypal-button-container-P-5G376592NK9596341M4L2EPA'); // Renders the PayPal button
    </script>
</body>
</html>
